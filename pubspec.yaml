name: pebble_routines
description: "A local-first routine support app with optional account backup."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# Play Console already has build 28 (built on a machine that no longer
# exists; its 27/28 changes are not in git). The next release must be 29+.
version: 1.0.0+31

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  image_picker: ^1.1.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.5
  drift: ^2.13.0
  path_provider: ^2.0.15
  sqlite3_flutter_libs: ^0.5.15
  google_fonts: ^6.2.1
  go_router: ^12.1.1
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  flutter_timezone: ^5.0.0
  path: ^1.9.1
  lucide_icons_flutter: ^3.1.12
  supabase_flutter: ^2.8.4
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  flutter_image_compress: ^2.4.0
  url_launcher: ^6.3.2
  record: ^6.0.0
  just_audio: ^0.10.0
  purchases_flutter: ^10.1.1
  home_widget: ^0.9.3
  sentry_flutter: ^9.0.0
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  drift_dev: ^2.13.0
  flutter_launcher_icons: ^0.14.3

# Launcher icon generation (run: dart run flutter_launcher_icons).
# Source art lives in assets/icon/. app_icon_full.png is the full-bleed icon
# (green background baked in) used for iOS and the legacy Android icon;
# ic_launcher_foreground.png is the transparent cairn sized for the Android
# adaptive-icon safe zone, on the #2C4434 green background.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_full.png"
  adaptive_icon_background: "#2C4434"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/seed/templates_en.json
    - assets/images/logo.png
    - assets/audio/step_complete.wav
