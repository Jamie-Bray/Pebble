# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

linter:
  # High-signal, bug-catching rules on top of flutter_lints. Deliberately no
  # style-only noise (const-everywhere, quote style) — every rule here points
  # at a class of real defect, weighted toward the async/stream mistakes a
  # sync-and-backup app is most exposed to.
  rules:
    - unawaited_futures           # fire-and-forget must be explicit (unawaited)
    - avoid_dynamic_calls         # unsafe dynamic dispatch -> runtime crash
    - collection_methods_unrelated_type  # List<int>.contains('x') style bugs
    - cancel_subscriptions        # leaked StreamSubscriptions
    - close_sinks                 # leaked StreamControllers
    - throw_in_finally            # swallowed errors
    - unnecessary_statements      # no-op expressions (often a real mistake)
    - null_check_on_nullable_type_parameter
    - cast_nullable_to_non_nullable
    - no_adjacent_strings_in_list # accidental missing comma

analyzer:
  errors:
    invalid_annotation_target: ignore
  language:
    strict-casts: true            # no implicit dynamic -> T casts

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
