<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="You allowed completion emails from a Pebble Routines user."
    />
    <title>Completion emails allowed | Pebble Routines</title>
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="../../favicon-96x96.png" />
    <link rel="manifest" href="../../manifest.json" />
    <link rel="stylesheet" href="../../legal.css" />
  </head>
  <body class="shared-alert-page">
    <main class="shared-alert-shell" aria-labelledby="page-title">
      <section class="shared-alert-card accepted">
        <div class="shared-alert-inner">
          <div class="shared-alert-brand">
            <div class="brand" aria-label="Pebble Routines">
              <span class="brand-mark" aria-hidden="true">P</span>
              <span>Pebble Routines</span>
            </div>
            <div class="shared-alert-badge">Allowed</div>
          </div>

          <div class="shared-alert-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>

          <div class="shared-alert-copy">
            <h1 id="page-title">Completion emails allowed</h1>
            <p class="body-copy">
              Pebble will email you when this person completes the routine they chose.
            </p>
          </div>

          <div class="shared-alert-note">
            <span aria-hidden="true"></span>
            <p>
              Every completion email has links to stop the emails or block the sender. You can close this tab now.
            </p>
          </div>
        </div>
      </section>
      <p class="shared-alert-footer">
        Pebble Routines · <a href="../../privacy.html#completion-emails">Privacy</a>
      </p>
    </main>
  </body>
</html>
