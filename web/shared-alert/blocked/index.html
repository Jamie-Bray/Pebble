<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pebble shared alert sender blocked."
    />
    <title>Future invites blocked | Pebble Routines</title>
    <link rel="icon" type="image/png" href="../../favicon.png" />
    <link rel="stylesheet" href="../../legal.css" />
  </head>
  <body class="shared-alert-page">
    <main class="shared-alert-shell" aria-labelledby="page-title">
      <section class="shared-alert-card blocked">
        <div class="shared-alert-inner">
          <div class="shared-alert-brand">
            <div class="brand" aria-label="Pebble Routines">
              <span class="brand-mark" aria-hidden="true">P</span>
              <span>Pebble Routines</span>
            </div>
            <div class="shared-alert-badge">Sender blocked</div>
          </div>

          <div class="shared-alert-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2.2"/>
              <path d="m7.8 16.2 8.4-8.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </div>

          <div class="shared-alert-copy">
            <h1 id="page-title">Future invites blocked</h1>
            <p class="body-copy">
              Pebble will not send future shared alert invites from this sender.
            </p>
          </div>

          <div class="shared-alert-note">
            <span aria-hidden="true"></span>
            <p>
              The sender will not be notified of your action and will be left in
              a pending state. You can close this tab now.
            </p>
          </div>
        </div>
      </section>
      <p class="shared-alert-footer">Pebble shared alerts</p>
    </main>
  </body>
</html>
