<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pebble shared alert request declined."
    />
    <title>Alert request declined | Pebble Routines</title>
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="../../favicon-96x96.png" />
    <link rel="manifest" href="../../manifest.json" />
    <link rel="stylesheet" href="../../legal.css" />
  </head>
  <body class="shared-alert-page">
    <main class="shared-alert-shell" aria-labelledby="page-title">
      <section class="shared-alert-card declined">
        <div class="shared-alert-inner">
          <div class="shared-alert-brand">
            <div class="brand" aria-label="Pebble Routines">
              <span class="brand-mark" aria-hidden="true">P</span>
              <span>Pebble Routines</span>
            </div>
            <div class="shared-alert-badge">Request declined</div>
          </div>

          <div class="shared-alert-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </div>

          <div class="shared-alert-copy">
            <h1 id="page-title">Alert request declined</h1>
            <p class="body-copy">
              Pebble will not send completion emails for this request.
            </p>
          </div>

          <div class="shared-alert-note">
            <span aria-hidden="true"></span>
            <p>You can close this tab now.</p>
          </div>
        </div>
      </section>
      <p class="shared-alert-footer">Pebble shared alerts</p>
    </main>
  </body>
</html>
