<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pebble shared alert link problem."
    />
    <title>Link no longer works | Pebble Routines</title>
    <link rel="icon" type="image/png" href="../../favicon.png" />
    <link rel="stylesheet" href="../../legal.css" />
  </head>
  <body class="shared-alert-page">
    <main class="shared-alert-shell" aria-labelledby="page-title">
      <section class="shared-alert-card problem">
        <div class="shared-alert-inner">
          <div class="shared-alert-brand">
            <div class="brand" aria-label="Pebble Routines">
              <span class="brand-mark" aria-hidden="true">P</span>
              <span>Pebble Routines</span>
            </div>
            <div class="shared-alert-badge">Something went wrong</div>
          </div>

          <div class="shared-alert-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 8v5" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
              <path d="M12 17h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              <path d="M10.3 4.8 3.4 17.1A2 2 0 0 0 5.1 20h13.8a2 2 0 0 0 1.7-2.9L13.7 4.8a2 2 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </div>

          <div class="shared-alert-copy">
            <h1 id="page-title">Link no longer works</h1>
            <p class="body-copy">
              This invite may have expired, already been used, or the link may
              be invalid.
            </p>
          </div>

          <div class="shared-alert-note">
            <span aria-hidden="true"></span>
            <p>You can close this tab now.</p>
          </div>
        </div>
      </section>
      <p class="shared-alert-footer">Pebble shared alerts</p>
    </main>
  </body>
</html>
