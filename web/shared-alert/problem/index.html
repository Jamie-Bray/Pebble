<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="This Pebble completion email link did not work."
    />
    <title>Link not working | Pebble Routines</title>
    <link rel="icon" type="image/svg+xml" href="../../icons/pebble-cairn.svg" />
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="../../favicon-96x96.png" />
    <link rel="manifest" href="../../manifest.json" />
    <link rel="stylesheet" href="../../legal.css" />
  </head>
  <body class="shared-alert-page">
    <main class="shared-alert-shell" aria-labelledby="page-title">
      <section class="shared-alert-card problem">
        <div class="shared-alert-inner">
          <div class="shared-alert-brand">
            <div class="brand" aria-label="Pebble Routines">
              <span class="brand-mark" aria-hidden="true">P</span>
              <span>Pebble Routines</span>
            </div>
            <div class="shared-alert-badge">Link not working</div>
          </div>

          <div class="shared-alert-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 8v5" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
              <path d="M12 17h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              <path d="M10.3 4.8 3.4 17.1A2 2 0 0 0 5.1 20h13.8a2 2 0 0 0 1.7-2.9L13.7 4.8a2 2 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </div>

          <div class="shared-alert-copy">
            <h1 id="page-title">This link did not work</h1>
            <p class="body-copy">
              It may have expired, been replaced by a newer email, or been copied only in part.
            </p>
          </div>

          <div class="shared-alert-note">
            <span aria-hidden="true"></span>
            <p>
              Nothing has changed. If you want Pebble to stop emailing you, email us at <a href="mailto:privacy@pebbleroutines.com">privacy@pebbleroutines.com</a> and we will do it for you.
            </p>
          </div>
        </div>
      </section>
      <p class="shared-alert-footer">
        Pebble Routines · <a href="../../privacy.html#completion-emails">Privacy</a>
      </p>
    </main>
  </body>
</html>
