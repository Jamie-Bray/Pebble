[auth]
site_url = "https://pebbleroutines.com"
additional_redirect_urls = ["com.vix.pebble.routines://login-callback", "https://pebbleroutines.com"]
# The app never calls signInAnonymously; anonymous users would only inflate MAU
# and be able to call JWT-protected functions.
enable_anonymous_sign_ins = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
# Email sign-in is a typed code (verifyOTP with OtpType.email / OtpType.signup
# in lib/features/auth/data/auth_repository.dart), not a magic link. The code
# only reaches the user if the template prints {{ .Token }}, so both templates
# that signInWithOtp can trigger (existing user -> magic_link, new user ->
# confirmation) use the code template below.
otp_length = 8

[auth.email.template.magic_link]
subject = "Your Pebble sign-in code"
content_path = "./supabase/templates/email_code.html"

[auth.email.template.confirmation]
subject = "Your Pebble sign-in code"
content_path = "./supabase/templates/email_code.html"

[functions.shared-alert-accept]
verify_jwt = false

[functions.shared-alert-decline]
verify_jwt = false

[functions.shared-alert-block]
verify_jwt = false

[functions.cleanup-proof-retention]
verify_jwt = false

[functions.request-account-deletion]
verify_jwt = false

[functions.revenuecat-webhook]
verify_jwt = false

[functions.revenuecat-sync-entitlement]
verify_jwt = true

[functions.request-shared-alert-contact]
verify_jwt = true

[functions.send-routine-completion-alert]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
[functions.describe-proof-photo]
verify_jwt = true

# Optional sign-in: onboarding runs before sign-in, so the function checks the
# install ID and, when present, the user's token itself.
[functions.build-routine]
verify_jwt = false
