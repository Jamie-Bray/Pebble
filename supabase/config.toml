[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["com.vix.pebble.routines://login-callback"]
enable_anonymous_sign_ins = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[functions.shared-alert-accept]
verify_jwt = false

[functions.shared-alert-decline]
verify_jwt = false

[functions.shared-alert-block]
verify_jwt = false
